<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>双人联机宣传视频</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070d1c; color: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #stage { position: fixed; inset: 0; background:
      radial-gradient(ellipse at 20% 10%, rgba(63, 140, 255, .28), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(255, 74, 74, .25), transparent 55%),
      linear-gradient(180deg, #0b1630, #070d1c); }
    #stage::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 28px 28px; }
    .phone { position: absolute; }
    .phone .label { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 15px; font-weight: 900; margin-bottom: 6px; }
    .phone .label .dot { width: 12px; height: 12px; border-radius: 50%; }
    .phone.a .dot { background: #4da3ff; box-shadow: 0 0 10px #4da3ff; }
    .phone.b .dot { background: #ff5a5a; box-shadow: 0 0 10px #ff5a5a; }
    .phone .screen { position: relative; overflow: hidden; border-radius: 14px; border: 5px solid #1a1f2b; box-shadow: 0 0 0 2px #3a4152, 0 12px 34px rgba(0,0,0,.6); background: #000; }
    .phone.a .screen { box-shadow: 0 0 0 2px #4da3ff, 0 12px 34px rgba(0,0,0,.6), 0 0 26px rgba(77,163,255,.35); }
    .phone.b .screen { box-shadow: 0 0 0 2px #ff5a5a, 0 12px 34px rgba(0,0,0,.6), 0 0 26px rgba(255,90,90,.35); }
    .phone iframe { position: absolute; left: 0; top: 0; width: 844px; height: 390px; border: 0; transform-origin: 0 0; }
    #vs { position: absolute; font-weight: 900; color: #ffd36b; text-shadow: 0 2px 0 #6a3d00; font-size: 22px; letter-spacing: 2px; }
    #title { position: absolute; text-align: center; }
    #title .big { font-size: 46px; font-weight: 900; color: #ffe14a; letter-spacing: 3px; -webkit-text-stroke: 6px #b2160e; paint-order: stroke fill; text-shadow: 0 5px 0 #5a0a05, 0 10px 26px rgba(0,0,0,.6); line-height: 1.15; }
    #title .sub { margin-top: 8px; font-size: 22px; font-weight: 900; -webkit-text-stroke: 4px #000; paint-order: stroke fill; }
    #title .sub b { color: #7fe3ff; }
    #chipwrap { display: none; }
    #header { position: absolute; text-align: center; font-size: 26px; font-weight: 900; color: #ffe14a; letter-spacing: 2px; -webkit-text-stroke: 5px #7a1008; paint-order: stroke fill; text-shadow: 0 3px 0 #3a0603; }
    #header b { color: #fff; }
    #chip { position: absolute; display: flex; justify-content: center; pointer-events: none; }
    #chip span { white-space: nowrap; padding: 8px 20px; border-radius: 40px; font-size: 19px; font-weight: 900; background: linear-gradient(90deg, #ff3d6e, #ff8a2b); border: 3px solid #fff; box-shadow: 0 6px 20px rgba(255, 70, 90, .45); opacity: 0; }
    #chip.on span { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
    #cap { position: absolute; text-align: center; font-size: 25px; font-weight: 900; line-height: 1.35; -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 3px 8px rgba(0,0,0,.6); }
    #cap em { font-style: normal; color: #ffd84a; }
    #brand { position: absolute; font-size: 13px; font-weight: 700; opacity: .55; letter-spacing: 1px; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.on { animation: flash .22s ease-out both; }
    #outro { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at center, rgba(8,16,36,.72), rgba(4,8,20,.93)); text-align: center; }
    #outro.on { display: flex; animation: fade .5s both; }
    #outro .name { font-size: 54px; font-weight: 900; letter-spacing: 8px; background: linear-gradient(180deg, #fff3c4, #f0b43a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #6a3d00); animation: slam .5s .1s both; }
    #outro .tag { font-size: 24px; font-weight: 900; animation: pop .4s .4s both; }
    #outro .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 92%; }
    #outro .pill { padding: 8px 16px; border-radius: 30px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); font-size: 19px; font-weight: 800; animation: pop .4s both; }
    #outro .cta { margin-top: 6px; padding: 12px 30px; border-radius: 40px; font-size: 26px; font-weight: 900; color: #3a2300; background: linear-gradient(180deg, #ffe08a, #e89a1f); box-shadow: 0 5px 0 #8a5300; animation: pop .4s 1.1s both, pulse 1s 1.6s infinite; }
    #cover { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.1), rgba(0,0,0,.6)); }
    #cover.on { display: flex; }
    #cover .c1 { font-size: 64px; font-weight: 900; color: #fff; -webkit-text-stroke: 9px #000; paint-order: stroke fill; transform: rotate(-3deg); }
    #cover .c1 b { color: #7fe3ff; }
    #cover .c2 { margin-top: 4px; font-size: 92px; font-weight: 900; letter-spacing: 6px; background: linear-gradient(180deg, #fff6c8, #ffb02e 60%, #ff6a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #6a2d00) drop-shadow(0 0 24px rgba(255,160,40,.6)); }
    #cover .c3 { margin-top: 14px; padding: 10px 26px; border-radius: 40px; font-size: 30px; font-weight: 900; color: #3a2300; background: linear-gradient(180deg, #ffe08a, #e89a1f); box-shadow: 0 6px 0 #8a5300; }
    #cover .badge { position: absolute; top: 4%; right: 5%; padding: 8px 16px; border-radius: 12px; font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #7a3cff, #2f8cff); border: 3px solid #fff; transform: rotate(4deg); }
    @keyframes pop { from { transform: scale(.3) rotate(-6deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes slam { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pulse { 50% { transform: scale(1.07); } }
    @keyframes wobble { 50% { transform: scale(1.05) rotate(-2deg); } }
  </style>
</head>
<body>
  <div id="stage">
    <div class="phone a" id="pa"><div class="label"><span class="dot"></span><span>我的手机 · 蓝方</span></div><div class="screen"><iframe id="fa" src="../../index.html?capture=feed&nofs"></iframe></div></div>
    <div id="vs">VS</div>
    <div class="phone b" id="pb"><div class="label"><span class="dot"></span><span>好友的手机 · 红方</span></div><div class="screen"><iframe id="fb" src="../../index.html?capture=feed&nofs"></iframe></div></div>
    <div id="title"><div class="big">AI 做的王者<br>能联机了！</div><div class="sub">和朋友 <b>1v1</b> 实时对战</div></div>
    <div id="header">AI 做的王者 · <b>现在能联机了</b></div>
    <div id="chip"><span></span></div>
    <div id="cap"></div>
    <div id="brand">峡谷对决 3D · 双人联机</div>
    <div id="outro">
      <div class="name">峡谷对决 3D</div>
      <div class="tag">AI 做的王者 · 现在能和朋友联机</div>
      <div class="row">
        <span class="pill" style="animation-delay:.6s">🏠 4 位房间号</span>
        <span class="pill" style="animation-delay:.7s">🔄 红方视角翻转</span>
        <span class="pill" style="animation-delay:.8s">💬 快捷消息</span>
        <span class="pill" style="animation-delay:.9s">📶 断线重连</span>
      </div>
      <div class="row"><span class="pill" style="animation-delay:1s">🧠 游戏 + 服务器 全部 AI 开发</span></div>
      <div class="cta">想和朋友开黑的扣 1 👇</div>
    </div>
    <div id="cover"><div class="badge">全程 AI 开发</div><div class="c1">AI 做的<b>王者</b></div><div class="c2">能联机了！</div><div class="c3">和朋友 1v1 · 手机就能玩</div></div>
    <div id="flash"></div>
  </div>
  <script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js" } }</script>
  <script type="module" src="duo-director.js"></script>
</body>
</html>
